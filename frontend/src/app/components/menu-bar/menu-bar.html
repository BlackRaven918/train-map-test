<nav aria-label="Project navigation">
  <button mat-button data-menu-trigger [matMenuTriggerFor]="fileMenu" #fileTrigger="matMenuTrigger"
    (click)="openMenu(fileTrigger)" (mouseenter)="hoverMenu(fileTrigger)">File</button>
  <button mat-button data-menu-trigger [matMenuTriggerFor]="modeMenu" #modeTrigger="matMenuTrigger"
    (click)="openMenu(modeTrigger)" (mouseenter)="hoverMenu(modeTrigger)">Mode</button>
  <button mat-button data-menu-trigger [matMenuTriggerFor]="layerMenu" #layerTrigger="matMenuTrigger"
    (click)="openMenu(layerTrigger)" (mouseenter)="hoverMenu(layerTrigger)">Layer</button>
  <span class="current-mode">{{ mode() === 'move' ? 'Move' : 'Edit' }} mode</span>
</nav>
@if (projects.error()) {
  <div class="project-feedback" role="alert">{{ projects.error() }}</div>
}
@if (projects.message()) {
  <div class="project-feedback" role="status">{{ projects.message() }}</div>
}

<mat-menu #fileMenu="matMenu" [hasBackdrop]="false">
  <button mat-menu-item [disabled]="projects.busy()" (click)="fileAction('new')">New</button>
  <button mat-menu-item [disabled]="projects.busy()" (click)="fileAction('open')">Open</button>
  <button mat-menu-item [disabled]="projects.busy()" (click)="fileAction('save')">Save</button>
  <button mat-menu-item [disabled]="projects.busy()" (click)="fileAction('saveAs')">Save As</button>
</mat-menu>

<mat-menu #layerMenu="matMenu" [hasBackdrop]="false">
  <button mat-menu-item (click)="importGtfs()">Import GTFS as layer</button>
  <button mat-menu-item (click)="viewLayers()">View layers</button>
</mat-menu>

<mat-menu #modeMenu="matMenu" [hasBackdrop]="false">
    <button mat-menu-item role="menuitemradio" [attr.aria-checked]="mode() === 'move'"
      (click)="mode.set('move'); finishMenu()" [class.selected]="mode() === 'move'">
      <span class="mode-check" aria-hidden="true">{{ mode() === 'move' ? '✓' : '' }}</span>Move
    </button>
    <button mat-menu-item role="menuitemradio" [attr.aria-checked]="mode() === 'edit'"
      (click)="mode.set('edit'); finishMenu()" [class.selected]="mode() === 'edit'">
      <span class="mode-check" aria-hidden="true">{{ mode() === 'edit' ? '✓' : '' }}</span>Edit
    </button>
</mat-menu>
