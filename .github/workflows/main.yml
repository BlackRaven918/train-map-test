name: CodeQL

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  schedule:
    - cron: "23 4 * * 1"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  analyze:
    name: Analyze (${{ matrix.language }})
    runs-on: ubuntu-latest
    permissions:
      contents: read
      actions: read
      security-events: write

    strategy:
      fail-fast: false
      matrix:
        language: [javascript-typescript, python]

    steps:
      - name: Checkout repository
        uses: actions/checkout@v7

      - name: Initialize CodeQL
        uses: github/codeql-action/init@v4
        with:
          languages: ${{ matrix.language }}
          build-mode: none

      - name: Analyze
        id: analyze
        uses: github/codeql-action/analyze@v4
        with:
          category: "/language:${{ matrix.language }}"

      - name: Fail on CodeQL findings
        env:
          SARIF_DIR: ${{ steps.analyze.outputs.sarif-output }}
        shell: bash
        run: |
          python3 - <<'PY'
          import json
          import os
          import sys
          from pathlib import Path

          directory = os.environ.get("SARIF_DIR")
          if not directory:
              sys.exit("::error::CodeQL did not return a SARIF directory.")

          files = list(Path(directory).rglob("*.sarif"))
          if not files:
              sys.exit("::error::No CodeQL SARIF reports found.")

          findings = 0
          for file in files:
              report = json.loads(file.read_text(encoding="utf-8"))
              for run in report.get("runs", []):
                  findings += len(run.get("results", []))

          if findings:
              sys.exit(f"::error::CodeQL detected {findings} finding(s).")

          print("No CodeQL findings detected.")
          PY
