# Commit this file as .github/workflows/sca.yml in the repository to scan.
# Python: requirements.txt (exact pins), poetry.lock, Pipfile.lock, uv.lock, pylock.toml.
# JS/TS: package-lock.json, yarn.lock, pnpm-lock.yaml, bun.lock.
# Commit resolved dependencies: package.json or pyproject.toml alone is insufficient.
# requirements.txt must include transitive dependencies (e.g. generated by pip-compile).
# Scope: known dependency vulnerabilities; no license policy is enforced.
name: Software Composition Analysis

on:
  pull_request:
  push:
    branches: [main, master] # Adjust if your default branch has another name.
  schedule:
    - cron: '23 6 * * 1' # Weekly Monday scan; GitHub cron uses UTC.
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: sca-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

env:
  FAIL_SEVERITIES: HIGH,CRITICAL # Use MEDIUM,HIGH,CRITICAL for a stricter gate.

jobs:
  sca:
    name: Dependency vulnerability scan
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    defaults:
      run:
        shell: bash

    steps:
      - name: Set report directory
        run: echo "REPORT_DIR=$RUNNER_TEMP/sca-reports" >> "$GITHUB_ENV"

      # Existing steps follow...
      - name: Check out repository
        uses: actions/checkout@8e8c483db84b4bee98b60c0593521ed34d9990e8 # v6.0.1
        with:
          persist-credentials: false

      - name: Install Trivy
        uses: aquasecurity/setup-trivy@81e514348e19b6112ce2a7e3ecbafe19c1e1f567 # v0.3.1
        with:
          version: v0.76.1
          cache: false
          token: ${{ github.token }}

      # No pip/npm install: read committed dependency files without executing
      # package build hooks. Recursive scanning also covers monorepo subdirectories.
      - name: Scan dependencies
        run: |
          mkdir -p "$REPORT_DIR"
          trivy fs \
            --scanners vuln \
            --pkg-types library \
            --include-dev-deps \
            --list-all-pkgs \
            --skip-dirs .git \
            --skip-dirs node_modules \
            --skip-dirs .venv \
            --timeout 10m \
            --format json \
            --output "$REPORT_DIR/vulnerabilities.json" \
            --exit-code 0 \
            .

      - name: Verify scan coverage
        run: |
          python3 - <<'PY'
          import json
          import os
          from pathlib import Path

          report = json.loads((Path(os.environ['REPORT_DIR']) / 'vulnerabilities.json').read_text())
          results = report.get('Results') or []
          packages = sum(len(result.get('Packages') or []) for result in results)
          if not packages:
              raise SystemExit('No dependency packages detected. Commit supported lockfiles or fully pinned requirements.txt.')
          print(f'Scan detected {packages} package entries across {len(results)} targets.')
          PY

      - name: Generate reports and SBOM
        run: |
          trivy convert --format table \
            --output "$REPORT_DIR/vulnerabilities.txt" \
            "$REPORT_DIR/vulnerabilities.json"
          trivy convert --format sarif \
            --output "$REPORT_DIR/vulnerabilities.sarif" \
            "$REPORT_DIR/vulnerabilities.json"
          trivy convert --format cyclonedx \
            --output "$REPORT_DIR/sbom.cdx.json" \
            "$REPORT_DIR/vulnerabilities.json"

      - name: Enforce severity policy
        run: |
          trivy convert --format table \
            --severity "$FAIL_SEVERITIES" \
            --exit-code 1 \
            "$REPORT_DIR/vulnerabilities.json"

      - name: Upload reports even when the policy fails
        if: ${{ always() }}
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: sca-reports
          path: ${{ runner.temp }}/sca-reports/
          retention-days: 14
          if-no-files-found: warn
